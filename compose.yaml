services:
  vpngate2socks:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/vpngate2socks:latest
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - NET_ADMIN
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    read_only: true
    tmpfs:
      - /run:size=16m,mode=0755
      - /tmp:size=16m,mode=1777
    volumes:
      - vpngate2socks-data:/var/lib/vpngate2socks
    ports:
      - 127.0.0.1:8080:8080
      - 127.0.0.1:1080:1080
    environment:
      VPNGATE2SOCKS_UPSTREAM: ${VPNGATE2SOCKS_UPSTREAM:?set an IPv4 SOCKS5 endpoint}
      VPNGATE2SOCKS_UPSTREAM_USER: ${VPNGATE2SOCKS_UPSTREAM_USER:-}
      VPNGATE2SOCKS_UPSTREAM_PASSWORD: ${VPNGATE2SOCKS_UPSTREAM_PASSWORD:-}
      RUST_LOG: ${RUST_LOG:-vpngate2socks=info,tower_http=info}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$${VPNGATE2SOCKS_TLS_CERT:-}" ]; then
          curl --noproxy '*' -fk https://127.0.0.1:8080/healthz;
          else curl --noproxy '*' -f http://127.0.0.1:8080/healthz; fi
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    stop_grace_period: 45s
    pids_limit: 512

volumes:
  vpngate2socks-data: {}
